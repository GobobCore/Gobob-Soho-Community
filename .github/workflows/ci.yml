name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# 拆分后 (2026-09-16): community/ 是公开版, cloud/ 在 .gitignore
# CI 只验证 community/ 部分 (shared/ + community/)
# SaaS 闭源部分在内部 Gitea 单独 CI

jobs:
  backend-import:
    name: Backend import + routes
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - name: Install deps
        run: |
          cd shared/backend-core
          pip install -r requirements.txt
      - name: Import check (community 入口)
        run: |
          python -c "
          import sys
          sys.path.insert(0, 'shared/backend-core')
          sys.path.append('community/backend')
          from main import create_app
          app = create_app()
          print(f'community backend: {len(app.routes)} routes')
          saas = [r for r in app.routes if '/api/saas' in str(r.path)]
          print(f'  SaaS routes (应 0): {len(saas)}')
          assert len(saas) == 0, 'community 版不应有 SaaS 路由'
          print('✓ community 入口正确')
          "

  # R-Feat 2026-10-01: 后端 pytest。
  # 此前 CI 完全不跑测试, 导致本机积累的 9 个 collection error / 版本漂移无人发现。
  # 关键: 必须按 requirements.txt 装依赖 —— 直接 pip install 会拉到
  # fastapi 0.109 + starlette 0.36 + httpx 0.28 的错位组合, TestClient 全部报错。
  backend-test:
    name: Backend pytest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - name: Install deps
        run: |
          pip install -r shared/backend-core/requirements.txt
          pip install pytest
      - name: Verify dependency compatibility
        run: |
          python -c "
          import fastapi, starlette, httpx
          print(f'fastapi={fastapi.__version__} starlette={starlette.__version__} httpx={httpx.__version__}')

          # 真正的不兼容点是 starlette 太老: starlette<0.37 的 TestClient 仍用
          # httpx.Client(app=...), 而 httpx>=0.28 已移除该参数。
          # requirements 已把 starlette 锁在 >=0.40,<0.46, 这里做行为级验证 ——
          # 比断言版本字符串更可靠: starlette 何时再次移除该参数都不必改这里。
          from starlette.testclient import TestClient
          from fastapi import FastAPI
          app = FastAPI()
          @app.get('/ping')
          def ping(): return {'ok': True}
          c = TestClient(app)
          assert c.get('/ping').json() == {'ok': True}, 'TestClient 不可用'
          print('✓ TestClient 与当前 httpx 兼容')
          "
      - name: Run pytest
        run: |
          # 不加 -x: 一次跑完看清全部失败, 而不是只报第一个
          python -m pytest shared/backend-core/tests/ -q --no-header

  portal-build:
    name: Portal (Next.js) build + vitest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        # R-Fix 2026-10-01: 20 → 22。portal 的 vitest.setup.ts 里有条件式
        # fetch/TextEncoder polyfill (仅在缺失时注入), 对 Node 运行时版本敏感;
        # 22 是本地实测 6/6 通过的版本。package.json 暂无 engines 声明,
        # 后续建议补上 "engines": { "node": ">=22" } 与此保持一致。
        with: { node-version: "22" }
      - name: Build
        run: |
          cd community/portal
          npm ci --no-audit --no-fund
          npm run build
      - name: "Vitest (R-Feat 2026-09-16: 关键组件测试)"
        run: |
          cd community/portal
          npm run test
      - name: Verify .next exists
        run: |
          test -d community/portal/.next && echo "✓ portal build OK"

  # 业务核心 SQL migration 语法检查
  #
  # R-Fix 2026-10-01: 弃用 services.mysql + apt default-mysql-client。
  # ubuntu-24.04 上 default-mysql-client 解析到 MariaDB client, 连 MySQL 8
  # 存在兼容问题 (认证插件 / 保留字), 该 job 长期 failure。
  # 改为自带 mysql:8 容器, 用镜像自带的同版本 client, 并显式等待就绪。
  sql-syntax:
    name: SQL syntax
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Start MySQL 8
        run: |
          docker run -d --name soho-mysql \
            -e MYSQL_ROOT_PASSWORD=test -e MYSQL_DATABASE=gobob_soho_test \
            mysql:8 > /dev/null
          for i in $(seq 1 60); do
            docker exec soho-mysql mysqladmin ping -uroot -ptest > /dev/null 2>&1 && { echo "✓ MySQL 就绪 (${i}s)"; exit 0; }
            sleep 1
          done
          echo "✗ MySQL 60s 内未就绪"; docker logs soho-mysql | tail -20; exit 1
      - name: Run schema.sql + seed.sql
        run: |
          docker exec -i soho-mysql mysql -uroot -ptest gobob_soho_test < shared/backend-core/sql/schema.sql
          docker exec -i soho-mysql mysql -uroot -ptest gobob_soho_test < shared/backend-core/sql/seed.sql
          echo "✓ schema.sql + seed.sql 跑通"
      - name: Run all migrations (idempotent)
        run: |
          for m in shared/backend-core/sql/migrations/*.sql; do
            echo "  apply $(basename "$m")"
            docker exec -i soho-mysql mysql -uroot -ptest gobob_soho_test < "$m" \
              || { echo "✗ migration failed: $m"; exit 1; }
          done
          echo "✓ 所有 migration 幂等可跑"
      - name: Verify key tables exist
        run: |
          docker exec -i soho-mysql mysql -uroot -ptest gobob_soho_test -e "
          SELECT COUNT(*) AS tables FROM information_schema.tables WHERE table_schema='gobob_soho_test';
          SELECT COUNT(*) AS scopes FROM api_key_scopes;
          SELECT COUNT(*) AS orgs FROM orgs;
          "
