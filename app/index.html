<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Gobob SOHO — 服务平台</title>
  <link rel="icon" href="/logo.svg" />
  <script src="/vue.js"></script>
  <script src="/tailwind.js"></script>
  <style>
    [v-cloak]{display:none}
    .navlink{transition:all .15s}
    .navlink.active{background:#eff6ff;color:#1d4ed8;border-left:3px solid #1d4ed8}
    .kanban-card{transition:box-shadow .15s}
    .kanban-card:hover{box-shadow:0 2px 8px rgba(0,0,0,.08)}
  </style>
</head>
<body class="bg-slate-100 text-slate-800">
  <div id="app" v-cloak>
    <!-- 未登录：登录页 -->
    <login-view v-if="!loggedIn" @logged-in="onLoggedIn"></login-view>

    <!-- 已登录：主框架 -->
    <div v-else class="flex min-h-screen">
      <!-- 侧边栏 -->
      <aside class="w-56 bg-white border-r border-slate-200 flex flex-col fixed inset-y-0">
        <div class="h-14 flex items-center gap-2 px-4 border-b border-slate-200">
          <img src="/logo.svg" class="w-7 h-7" />
          <div>
            <div class="font-bold text-sm leading-tight">Gobob SOHO</div>
            <div class="text-xs text-slate-400">{{ isStaffNow ? '机构端' : '学生端' }}</div>
          </div>
        </div>
        <nav class="flex-1 overflow-y-auto py-2">
          <template v-for="group in navGroups" :key="group.title">
            <div class="px-4 pt-4 pb-1 text-xs font-semibold text-slate-400">{{ group.title }}</div>
            <a v-for="item in group.items" :key="item.view"
               @click="go(item.view)"
               :class="['navlink flex items-center gap-2 px-4 py-2 text-sm cursor-pointer text-slate-600 hover:bg-slate-50', currentView===item.view?'active':'']">
              <span>{{ item.icon }}</span><span>{{ item.label }}</span>
            </a>
          </template>
        </nav>
        <div class="border-t border-slate-200 p-3">
          <!-- Phase 5: 家长多学生切换 -->
          <div v-if="role === 'parent' && myStudents.length > 1" class="mb-2">
            <select v-model="activeStudentId" @change="switchStudent" class="w-full text-xs border rounded-lg px-2 py-1.5">
              <option v-for="s in myStudents" :value="s.id">{{ s.name }}</option>
            </select>
          </div>
          <div class="text-sm font-medium">{{ user.name || user.username }}</div>
          <div class="text-xs text-slate-400 mb-2">{{ roleLabel }}</div>
          <button @click="logout" class="text-xs text-red-500 hover:underline">退出登录</button>
        </div>
      </aside>

      <!-- 主内容 -->
      <main class="flex-1 ml-56 p-6">
        <component :is="currentComponent" v-if="currentView" :ctx="ctx" @navigate="go"></component>
      </main>
    </div>

    <!-- 全局 toast -->
    <div v-if="toast.msg" class="fixed bottom-6 right-6 z-50 px-4 py-3 rounded-lg shadow-lg text-white text-sm"
         :class="toast.type==='error'?'bg-red-500':'bg-emerald-600'">{{ toast.msg }}</div>
  </div>

  <script src="/js/shared.js"></script>
  <script src="/js/views.js"></script>
  <script src="/js/app.js"></script>
</body>
</html>
