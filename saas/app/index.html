<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Gobob SOHO — SaaS 多机构版</title>
  <link rel="icon" href="/logo.svg" />
  <script src="/vue.js"></script>
  <script src="/tailwind.js"></script>
  <style>
    /* R-Design 2026-09-16 v2: 跟 portal 对齐
       - 主色: 暖橙 (primary) 替代蓝 (#1d4ed8)
       - navlink active: 浅橙底 + 主色文字 + 主色左边条
       - 背景: 跟 portal 一致的柔和底色 (slate-100 → 暖白)
    */
    :root {
      --primary-50:  #FDF6EE;
      --primary-100: #FAE6CD;
      --primary-200: #F4CC9A;
      --primary-300: #EDB776;
      --primary-500: #E08A44;
      --primary-600: #C97636;
      --primary-700: #A85F26;
    }
    [v-cloak]{display:none}
    body {
      background:
        radial-gradient(1200px 600px at 80% -10%, rgba(224, 138, 68, 0.06), transparent 60%),
        radial-gradient(900px 500px at -10% 20%, rgba(201, 118, 54, 0.04), transparent 60%),
        #F9FAFB;
    }
    .navlink{transition:all .15s;color:#4B5563}
    .navlink:hover{background:var(--primary-50);color:var(--primary-700)}
    .navlink.active{
      background:var(--primary-50);
      color:var(--primary-700);
      border-left:3px solid var(--primary-600);
      font-weight:600;
    }
    .navlink svg{color:currentColor}
    .kanban-card{transition:box-shadow .15s}
    .kanban-card:hover{box-shadow:0 2px 8px rgba(0,0,0,.08)}
    /* 主按钮 (跟 portal 对齐) */
    .btn-primary{
      display:inline-flex;align-items:center;justify-content:center;gap:.5rem;
      padding:.5rem 1rem;border-radius:.75rem;font-weight:600;color:#fff;
      background:linear-gradient(135deg, var(--primary-500), var(--primary-600));
      box-shadow:0 4px 20px rgba(224, 138, 68, 0.28);
      transition:all .2s;
    }
    .btn-primary:hover{
      background:linear-gradient(135deg, var(--primary-600), var(--primary-700));
      transform:translateY(-1px);
      box-shadow:0 8px 24px rgba(15, 23, 42, 0.1);
    }
  </style>
</head>
<body class="text-slate-800">
  <!-- R-Design 2026-09-16: 顶部品牌装饰条 (跟 portal 一致) -->
  <div class="h-1 bg-gradient-to-r from-[#E08A44] via-[#E59E56] to-[#C97636]"></div>

  <div id="app" v-cloak>
    <!-- 未登录：登录页 / 注册页 (由 hash 路由切换) -->
    <login-view v-if="!loggedIn && authView === 'login'" @logged-in="onLoggedIn"></login-view>
    <register-view v-else-if="!loggedIn && authView === 'register'"></register-view>

    <!-- 已登录：主框架 -->
    <div v-else class="flex min-h-screen">
      <!-- 侧边栏 -->
      <aside class="w-56 bg-white border-r border-slate-200 flex flex-col fixed inset-y-0 shadow-sm">
        <div class="h-14 flex items-center gap-2.5 px-4 border-b border-slate-200">
          <!-- R-Design: logo 加渐变徽章 (跟 portal 一致) -->
          <div class="w-8 h-8 rounded-xl bg-gradient-to-br from-[#E08A44] to-[#C97636] flex items-center justify-center shadow-[0_4px_12px_rgba(224,138,68,0.32)]">
            <img src="/logo.svg" class="w-5 h-5 brightness-0 invert" />
          </div>
          <div>
            <div class="font-bold text-sm leading-tight tracking-tight">SaaS 多机构版</div>
            <div class="text-xs text-slate-400">{{ isStaffNow ? '机构端' : '学生端' }}</div>
          </div>
        </div>
        <nav class="flex-1 overflow-y-auto py-2">
          <template v-for="group in navGroups" :key="group.title">
            <div class="px-4 pt-4 pb-1 text-xs font-semibold text-slate-400 uppercase tracking-wider">{{ group.title }}</div>
            <a v-for="item in group.items" :key="item.view"
               @click="go(item.view)"
               :class="['navlink flex items-center gap-2.5 px-4 py-2 text-sm cursor-pointer', currentView===item.view?'active':'']">
              <!-- R-Design: v-html 渲染 SVG 图标 (替代 emoji) -->
              <span v-html="item.icon" class="inline-flex items-center"></span>
              <span>{{ item.label }}</span>
            </a>
          </template>
        </nav>
        <div class="border-t border-slate-200 p-3">
          <!-- Phase 5: 家长多学生切换 -->
          <div v-if="role === 'parent' && myStudents.length > 1" class="mb-2">
            <select v-model="activeStudentId" @change="switchStudent" class="w-full text-xs border rounded-lg px-2 py-1.5">
              <option v-for="s in myStudents" :value="s.id">{{ s.name }}</option>
            </select>
          </div>
          <div class="text-sm font-medium">{{ user.name || user.username }}</div>
          <div class="text-xs text-slate-400 mb-2">{{ roleLabel }}</div>
          <a href="https://github.com/GobobCore/Gobob-Soho-Community" target="_blank"
             class="block text-xs text-slate-500 hover:text-blue-600 hover:underline mb-2">
            <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="w-3.5 h-3.5 inline-block align-text-bottom mr-1"><path d="M15 22v-4a4.8 4.8 0 0 0-1-3.5c3 0 6-2 6-5.5.08-1.25-.27-2.48-1-3.5.28-1.15.28-2.35 0-3.5 0 0-1 0-3 1.5-2.64-.5-5.36-.5-8 0C6 2.69 5 4.69 5 4.69c-.3 1.15-.3 2.35 0 3.5A5.403 5.403 0 0 0 4 9c0 3.5 3 5.5 6 5.5-.39.49-.68 1.05-.85 1.65-.17.6-.22 1.24-.15 1.85v4"/><path d="M9 18c-4.51 2-5-2-7-2.5"/></svg>
            GitHub 社区版 →
          </a>
          <button @click="logout" class="text-xs text-red-500 hover:underline">退出登录</button>
        </div>
      </aside>

      <!-- 主内容 -->
      <main class="flex-1 ml-56 p-6">
        <component :is="currentComponent" v-if="currentView" :ctx="ctx" @navigate="go"></component>
      </main>
    </div>

    <!-- 全局 toast -->
    <div v-if="toast.msg" class="fixed bottom-6 right-6 z-50 px-4 py-3 rounded-lg shadow-lg text-white text-sm"
         :class="toast.type==='error'?'bg-red-500':'bg-emerald-600'">{{ toast.msg }}</div>
  </div>

  <script src="/js/shared.js"></script>
  <script src="/js/views.js"></script>
  <script src="/js/app.js"></script>
</body>
</html>
